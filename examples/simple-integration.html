<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web Component Integration</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .page {
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>Welcome to My Site</h1>
        <p>This page uses Module Federation components as Web Components</p>
        
        <!-- Just drop in the web component tag! -->
        <products-widget theme="light"></products-widget>
    </div>

    <!-- Load the web component bundle -->
    <script type="module" src="../remotes/products/dist-webcomponent/products-widget.js"></script>
</body>
</html>
