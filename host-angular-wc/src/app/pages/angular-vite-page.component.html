<div class="page-container">
  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Loading Angular Vite widget...</p>
  </div>
  <div *ngIf="error" class="error">
    <p class="error-title">Failed to load Angular Vite Widget</p>
    <p class="error-message">{{ error }}</p>
    <p class="error-hint">
      Make sure the Angular Vite widget is built and copied to
      <code>/widgets/angular-vite-widget.js</code>
    </p>
  </div>
  <div *ngIf="!loading && !error" class="widget-container">
    <angular-vite-widget [attr.theme]="theme"></angular-vite-widget>
  </div>
</div>
