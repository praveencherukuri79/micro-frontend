<div class="page-container">
  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Loading Angular Webpack widget...</p>
  </div>
  <div *ngIf="error" class="error">
    <p class="error-title">Failed to load Angular Webpack Widget</p>
    <p class="error-message">{{ error }}</p>
    <p class="error-hint">
      Make sure the Angular Webpack widget is built and copied to
      <code>/widgets/angular-webpack-widget.js</code>
    </p>
  </div>
  <div *ngIf="!loading && !error" class="widget-container">
    <angular-webpack-widget 
      [attr.theme]="theme"
      [attr.api-base-path]="apiBasePath">
    </angular-webpack-widget>
  </div>
</div>
