<div class="page-container">
  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Loading contact widget...</p>
  </div>
  <div *ngIf="error" class="error">
    <p class="error-title">Failed to load Contact Widget</p>
    <p class="error-message">{{ error }}</p>
    <p class="error-hint">
      Make sure the contact widget is built and copied to
      <code>/widgets/contact-widget.js</code>
    </p>
  </div>
  <contact-widget 
    *ngIf="!loading && !error"
    [attr.theme]="theme"
    [attr.api-base-path]="apiBasePath">
  </contact-widget>
</div>
